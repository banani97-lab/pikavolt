name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web & packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build

  flutter:
    name: Flutter (apps/mobile)
    runs-on: ubuntu-latest
    # apps/mobile is created by a later agent — skip until it exists.
    if: hashFiles('apps/mobile/pubspec.yaml') != ''
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
